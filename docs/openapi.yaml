openapi: 3.1.0
info:
  title: ThingsToDo API
  version: 0.13.2
  summary: Self-hosted Things 3-inspired task manager API
  description: |
    The /api surface of ThingsToDo. Everything an agent, widget or script
    can do goes through this API; the MCP server at /mcp wraps it (see
    README). Authentication is a Bearer token: the master API_KEY or a
    named ttd_ token. Errors always use the JSON envelope
    {error, code, field?}. Calendar-day boundaries use the server TZ.
servers:
  - url: /
    description: Same-origin deployment (SPA, widgets, agents)
tags:
  - name: auth
  - name: tokens
    description: Named API tokens; a named token cannot manage tokens (403).
  - name: tasks
  - name: checklist
  - name: attachments
  - name: reminders
  - name: schedules
  - name: repeat
  - name: push
  - name: projects
  - name: headings
  - name: areas
  - name: tags
  - name: views
  - name: settings
  - name: saved-filters
  - name: search
  - name: sync
  - name: events
  - name: meta

security:
  - bearerAuth: []

paths:
  /api/openapi.yaml:
    get:
      tags: [meta]
      summary: This OpenAPI document
      operationId: getOpenAPI
      security: []
      responses:
        '200':
          description: The OpenAPI 3.1 contract, served verbatim
          content:
            application/yaml:
              schema:
                type: string

  /api/auth/config:
    get:
      tags: [auth]
      summary: Current auth mode
      operationId: getAuthConfig
      security: []
      responses:
        '200':
          description: Auth mode for the login page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'

  /api/auth/login:
    post:
      tags: [auth]
      summary: Password login (builtin mode only)
      operationId: login
      description: 404 in proxy/oidc modes. Sets the httpOnly JWT session
        cookie. Failed logins are rate-limited per client IP (10 failures
        per 15 minutes, then 429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/logout:
    delete:
      tags: [auth]
      summary: Log out (clear the session cookie)
      operationId: logout
      description: Local logout only (no IdP redirect). Builtin and oidc modes.
      security: []
      responses:
        '200':
          description: Cookie cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user and auth mode
      operationId: me
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/oidc/login:
    get:
      tags: [auth]
      summary: Start OIDC login (oidc mode only)
      operationId: oidcLogin
      description: Browser navigation, not a JSON API. Redirects to the IdP
        and sets a signed oidc_state cookie. Registered only when
        AUTH_MODE=oidc.
      security: []
      responses:
        '302':
          description: Redirect to the OIDC provider authorization endpoint

  /api/auth/oidc/callback:
    get:
      tags: [auth]
      summary: OIDC redirect URI (oidc mode only)
      operationId: oidcCallback
      description: Verifies state, exchanges the code, accepts only the
        configured OIDC_ALLOWED_EMAIL with email_verified, issues the app
        JWT cookie and redirects to /inbox. Registered only when
        AUTH_MODE=oidc.
      security: []
      responses:
        '302':
          description: Redirect to /inbox on success
        '403':
          description: Email not allowed or not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tokens:
    get:
      tags: [tokens]
      summary: List named API tokens
      operationId: listTokens
      responses:
        '200':
          description: Tokens (hashes and values are never returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [tokens]
      summary: Create a named API token
      operationId: createToken
      description: 'Not idempotent: every POST mints a new token. The
        plaintext token value is returned exactly once.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate token name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tokens/{id}:
    delete:
      tags: [tokens]
      summary: Revoke a named API token
      operationId: revokeToken
      description: Revoking is idempotent (204 for an already-revoked
        token); a revoked token stops authenticating immediately.
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks:
    get:
      tags: [tasks]
      summary: Query tasks
      operationId: listTasks
      description: Filter-only listing for widgets and agents. All params
        combine with AND; unknown params or invalid values get 400
        VALIDATION.
      parameters:
        - {name: status, in: query, description: 'Comma list of open,completed,canceled,wont_do. Default: all.', schema: {type: string}}
        - {name: list, in: query, description: 'inbox, today, upcoming, anytime, someday, logbook or trash (same predicates as /api/views/*).', schema: {type: string, enum: [inbox, today, upcoming, anytime, someday, logbook, trash]}}
        - {name: project_id, in: query, schema: {type: string}}
        - {name: area_id, in: query, schema: {type: string}}
        - {name: heading_id, in: query, schema: {type: string}}
        - {name: tag_ids, in: query, description: 'Comma list of tag ids.', schema: {type: string}}
        - {name: tag_mode, in: query, description: 'any (default) or all.', schema: {type: string, enum: [any, all]}}
        - {name: when_date, in: query, description: 'YYYY-MM-DD or someday.', schema: {type: string}}
        - {name: when_before, in: query, schema: {type: string, format: date}}
        - {name: when_after, in: query, schema: {type: string, format: date}}
        - {name: deadline_before, in: query, schema: {type: string, format: date}}
        - {name: deadline_after, in: query, schema: {type: string, format: date}}
        - {name: has_deadline, in: query, schema: {type: string, enum: ['true', 'false']}}
        - {name: has_when, in: query, schema: {type: string, enum: ['true', 'false']}}
        - {name: high_priority, in: query, schema: {type: string, enum: ['true', 'false']}}
        - {name: updated_since, in: query, description: 'Inclusive UTC timestamp.', schema: {type: string}}
        - {name: created_since, in: query, description: 'Inclusive UTC timestamp.', schema: {type: string}}
        - {name: search, in: query, description: 'FTS over title and notes (quoted tokens, no prefix match).', schema: {type: string}}
        - {name: sort, in: query, description: 'manual (default), when_date, deadline, created_at, updated_at, title; prefix - for descending.', schema: {type: string}}
        - {name: limit, in: query, description: '1-500. Opt-in pagination; without limit all matching tasks return.', schema: {type: integer, minimum: 1, maximum: 500}}
        - {name: cursor, in: query, description: Opaque cursor from the previous response., schema: {type: string}}
      responses:
        '200':
          description: Matching tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [tasks]
      summary: Create a task
      operationId: createTask
      description: Idempotent by a client-supplied body id (see
        docs/api.md). When the user settings carry a default reminder, it is
        added atomically with the task. Returns the full TaskDetail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateInput'
      responses:
        '201':
          description: Task created (200 when the id replayed an existing task)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/tasks/{id}:
    get:
      tags: [tasks]
      summary: Get one task
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [tasks]
      summary: Update a task
      operationId: updateTask
      description: Partial update; absent keys are untouched, explicit null
        clears. Container derivation follows docs/api.md.
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateInput'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [tasks]
      summary: Move a task to trash
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '204':
          description: Soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/purge:
    delete:
      tags: [tasks]
      summary: Permanently delete a task
      operationId: purgeTask
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '204':
          description: Purged
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/complete:
    patch:
      tags: [tasks]
      summary: Complete a task
      operationId: completeTask
      description: Guarded transactional finish — completes past/today
        schedule entries, deletes future ones, and for a repeat rule creates
        exactly one next instance. Idempotent for an already-finished task.
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Completed task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/cancel:
    patch:
      tags: [tasks]
      summary: Cancel a task
      operationId: cancelTask
      description: Same guarded finishing path as complete, with
        status=canceled.
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Canceled task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/wontdo:
    patch:
      tags: [tasks]
      summary: Mark a task won't-do
      operationId: wontdoTask
      description: Same guarded finishing path as complete, with
        status=wont_do.
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Won't-do task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/reopen:
    patch:
      tags: [tasks]
      summary: Reopen a task
      operationId: reopenTask
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Reopened task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/restore:
    patch:
      tags: [tasks]
      summary: Restore a task from trash
      operationId: restoreTask
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Restored task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/review:
    patch:
      tags: [tasks]
      summary: Mark a task reviewed
      operationId: reviewTask
      description: Bumps updated_at so the task leaves the review queue.
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/move:
    patch:
      tags: [tasks]
      summary: Move a task
      operationId: moveTask
      description: Precise move — only keys present in the body are
        applied; absent keys keep their stored values, explicit null clears.
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMoveInput'
      responses:
        '200':
          description: Moved task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/tasks/reorder:
    patch:
      tags: [tasks]
      summary: Reorder tasks
      operationId: reorderTasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskReorderRequest'
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/bulk:
    post:
      tags: [tasks]
      summary: Apply one action to many tasks
      operationId: bulkAction
      description: One transaction, at most 100 tasks. Status actions run
        the guarded finishing path per task; affected counts only real
        changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkActionRequest'
      responses:
        '200':
          description: Action applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/tasks/{id}/checklist:
    get:
      tags: [checklist]
      summary: List a task's checklist items
      operationId: listChecklist
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Checklist items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [checklist]
      summary: Add a checklist item
      operationId: createChecklistItem
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistCreate'
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/checklist/{id}:
    patch:
      tags: [checklist]
      summary: Update a checklist item
      operationId: updateChecklistItem
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistUpdate'
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [checklist]
      summary: Delete a checklist item
      operationId: deleteChecklistItem
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/attachments:
    get:
      tags: [attachments]
      summary: List a task's attachments
      operationId: listAttachments
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Attachments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentsList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [attachments]
      summary: Attach a file or a link
      operationId: createAttachment
      description: 'Files: multipart/form-data with a file field (the only
        way to create file attachments, capped by MAX_UPLOAD_SIZE). Links:
        application/json accepting only type=link; javascript:, data:,
        vbscript: and file: schemes are rejected with 400 VALIDATION.'
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentLinkCreate'
      responses:
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/attachments/{id}:
    patch:
      tags: [attachments]
      summary: Update an attachment
      operationId: updateAttachment
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentUpdate'
      responses:
        '200':
          description: Updated attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [attachments]
      summary: Delete an attachment
      operationId: deleteAttachment
      description: Deletes exactly the attachment row; the stored file is
        removed only when no other row references it.
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/attachments/{id}/file:
    get:
      tags: [attachments]
      summary: Download an attachment's file
      operationId: downloadAttachment
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Binary file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/repeat:
    get:
      tags: [repeat]
      summary: Get a task's repeat rule
      operationId: getRepeatRule
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Repeat rule or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepeatRuleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [repeat]
      summary: Create or replace a task's repeat rule
      operationId: upsertRepeatRule
      description: Accepts the pattern format (preferred) or the legacy
        flat format.
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepeatRuleUpsert'
      responses:
        '200':
          description: Stored repeat rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepeatRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [repeat]
      summary: Delete a task's repeat rule
      operationId: deleteRepeatRule
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/schedules:
    get:
      tags: [schedules]
      summary: List a task's schedule entries
      operationId: listSchedules
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      responses:
        '200':
          description: Schedule entries (max 12 per task)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulesList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [schedules]
      summary: Add a schedule entry
      operationId: createSchedule
      parameters:
        - $ref: '#/components/parameters/IdInPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
