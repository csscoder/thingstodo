            - type: string
              enum: [at_start, on_day, minutes_before, hours_before, days_before]
        default_reminder_value:
          type: integer
          minimum: 0
          maximum: 99
        copy_reminders_to_recurring:
          type: boolean
        notification_provider:
          type: string
          enum: [webpush, ntfy, none]
        ntfy_server_url:
          type: string
        ntfy_topic:
          type: string
        ntfy_access_token:
          type: string
        base_url:
          type: string
        privacy_mode:
          type: boolean
        review_include_recurring:
          type: boolean

    SavedFilter:
