        review_after_days:
          type: integer
        sort_areas:
          type: string
          enum: [manual, a-z, z-a]
        sort_tags:
          type: string
          enum: [manual, a-z, z-a]
        evening_starts_at:
          type: string
        default_time_gap:
          type: integer
        show_time_badge:
          type: boolean
        time_format:
          type: string
          enum: ['12h', '24h']
        font_size:
          type: integer
          minimum: 12
