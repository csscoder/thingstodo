        literal, operators never 500) and prefix-matched; ordered by rank
        then id.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 20, maximum: 500}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Ranked results with snippets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/sync/pull:
    get:
      tags: [sync]
      summary: Pull changes since a cursor
      operationId: syncPull
      parameters:
        - {name: since, in: query, description: 'Return changes after this sequence number.', schema: {type: integer, format: int64, default: 0}}
        - {name: limit, in: query, schema: {type: integer, default: 500, maximum: 1000}}
      responses:
        '200':
          description: Change-log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Cursor purged; perform a full sync
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sync/push:
    post:
      tags: [sync]
      summary: Push client changes
      operationId: syncPush
      description: Last-write-wins per entity. Supported entities are
        task, project, area, tag, heading, checklistItem, attachment,
        schedule and reminder. Task status finishes run the guarded
        finishing path; project/area deletes use the delete-to-trash
        semantics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Per-change results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'

  /api/sync/full:
    get:
      tags: [sync]
      summary: Full snapshot of every entity
      operationId: syncFull
      responses:
        '200':
          description: Complete state plus the current cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncFullResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events:
    get:
      tags: [events]
      summary: SSE change feed
      operationId: streamEvents
      description: text/event-stream. EventSource cannot send headers;
        read the stream with fetch() and a Bearer token instead. On connect
        the server sends a connected event; single-entity events carry
        {entity, id, seq}.
      responses:
        '200':
          description: Server-sent events stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The master API_KEY or a named ttd_ token (POST /api/tokens), sent
        as "Authorization: Bearer <token>". A named token authenticates as
        the first user and cannot call the /api/tokens endpoints.

  parameters:
    IdInPath:
      name: id
      in: path
      required: true
      description: Entity id (nanoid, 8-10 chars; doubles as permalink slug for tasks)
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,21}$'

  responses:
    BadRequest:
      description: Malformed JSON or invalid parameter (code BAD_REQUEST or VALIDATION)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials (code UNAUTHORIZED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed (code FORBIDDEN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Reserved:
      description: Reserved tag name (code RESERVED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown route or entity (code NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DuplicateName:
      description: Title or token name already exists (code DUPLICATE_NAME)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Field validation failed; 400 malformed value, 422 unknown referenced id (code VALIDATION, carries field)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BodyTooLarge:
      description: Request body over the size cap (code BODY_TOO_LARGE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many failed login attempts (code RATE_LIMITED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: The single JSON error envelope used by every endpoint
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable message
        code:
          type: string
          enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, BAD_REQUEST, VALIDATION, RESERVED, DUPLICATE_NAME, HAS_PROJECTS, CURSOR_EXPIRED, BODY_TOO_LARGE, LIMIT_REACHED, RATE_LIMITED, FILE_TOO_LARGE, NOT_CONFIGURED, INTERNAL]
        field:
          type: string
          description: Offending request field, present only for field-level errors

    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string

    AuthConfig:
      type: object
      required: [auth_mode]
      properties:
        auth_mode:
          type: string
          enum: [builtin, proxy, oidc, none]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    MeResponse:
      type: object
      required: [user, auth_mode]
      properties:
        user:
          $ref: '#/components/schemas/User'
        auth_mode:
          type: string
          enum: [builtin, proxy, oidc, none]

    TokenCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    TokenInfo:
      type: object
      required: [id, name, prefix, created_at, last_used_at, revoked_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: First 8 characters of the token value
        created_at:
          type: string
        last_used_at:
          type: [string, 'null']
          description: Updated at most once per minute per token
        revoked_at:
          type: [string, 'null']

    TokensList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'

    TokenCreated:
      type: object
      required: [id, name, prefix, token]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        token:
          type: string
