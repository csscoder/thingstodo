        sort_tags:
          type: string
          enum: [manual, a-z, z-a]
        evening_starts_at:
          type: string
          description: Zero-padded HH:MM 24h
        default_time_gap:
          type: integer
        show_time_badge:
          type: boolean
        time_format:
