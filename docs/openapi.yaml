          type: string

    ChangeLogEntry:
      type: object
      required: [seq, entity, entity_id, action, snapshot, created_at]
      properties:
        seq:
          type: integer
          format: int64
        entity:
          type: string
          enum: [task, project, area, tag, heading, checklist_item, attachment, schedule, reminder, repeat_rule]
        entity_id:
          type: string
        action:
          type: string
          enum: [create, update, delete]
        fields:
          type: [string, 'null']
          description: JSON-encoded string array of changed fields (for updates); null for create/delete
        snapshot:
          type: string
          description: Full entity state as a JSON string; empty for delete
        user_id:
          type: string
        device_id:
          type: string
        created_at:
          type: string

    SyncPullResponse:
      type: object
      required: [changes, cursor, has_more]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeLogEntry'
        cursor:
          type: integer
          format: int64
        has_more:
          type: boolean

    SyncPushChange:
      type: object
      required: [entity, entity_id, action, data]
      properties:
        entity:
          type: string
          enum: [task, project, area, tag, heading, checklistItem, attachment, schedule, reminder]
        entity_id:
          type: string
        action:
          type: string
          enum: [create, update, delete]
        data:
          type: object
        fields:
          type: array
          description: Fields to apply for an update; other data keys are ignored
          items:
            type: string
        client_updated_at:
          type: string
          description: RFC 3339 or 'YYYY-MM-DD HH:MM:SS'; drives last-write-wins

    SyncPushRequest:
      type: object
      required: [device_id, changes]
      properties:
        device_id:
