      properties:
        entity:
          type: string
        entity_id:
          type: string
        status:
          type: string
          enum: [applied, conflict_resolved, error]
        seq:
          type: integer
          format: int64
        error:
          type: string

    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncPushResult'

    SyncFullResponse:
