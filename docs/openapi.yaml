        title:
          type: string
        sort_order:
          type: number

    Area:
      type: object
      required: [id, title, sort_order, project_count, task_count, standalone_task_count, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        sort_order:
          type: number
        project_count:
          type: integer
        task_count:
          type: integer
        standalone_task_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string

    AreasList:
      type: object
      required: [areas]
      properties:
        areas:
          type: array
          items:
            $ref: '#/components/schemas/Area'

    AreaCreate:
      type: object
      required: [title]
      properties:
        id:
          type: string
          description: Optional client-supplied id; a known id replays 200
        title:
          type: string
          minLength: 1

    AreaUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
        sort_order:
          type: number

    AreaDetail:
      allOf:
        - $ref: '#/components/schemas/Area'
        - type: object
          required: [projects, tasks, completed_tasks]
          properties:
            projects:
              type: array
              items:
                $ref: '#/components/schemas/Project'
            tasks:
              type: array
              description: Standalone (project-less) tasks in this area
              items:
                $ref: '#/components/schemas/TaskListItem'
            completed_tasks:
              type: array
              items:
                $ref: '#/components/schemas/TaskListItem'

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            headings:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  sort_order:
                    type: number
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskListItem'
            tasks_without_heading:
              type: array
              items:
                $ref: '#/components/schemas/TaskListItem'
            completed_tasks:
              type: array
              items:
                $ref: '#/components/schemas/TaskListItem'

    Tag:
      type: object
      required: [id, title, color, parent_tag_id, sort_order, task_count]
      properties:
        id:
          type: string
        title:
          type: string
        color:
          type: [string, 'null']
        parent_tag_id:
          type: [string, 'null']
        sort_order:
          type: number
        task_count:
          type: integer

    TagsList:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    TagCreate:
      type: object
      required: [title]
      properties:
        id:
          type: string
          description: Optional client-supplied id; a known id replays 200
        title:
          type: string
          minLength: 1
        parent_tag_id:
          type: [string, 'null']

    TagUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
        color:
          type: [string, 'null']
        parent_tag_id:
          type: [string, 'null']
        sort_order:
          type: number

    ViewInbox:
      type: object
      required: [tasks, review]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'
        review:
          type: array
          description: Tasks not updated within review_after_days, excluding inbox tasks
          items:
            $ref: '#/components/schemas/TaskListItem'

    ProjectGroup:
      type: object
      required: [project, tasks]
      properties:
        project:
          oneOf:
            - $ref: '#/components/schemas/ProjectRef'
            - type: 'null'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'

    ViewToday:
      type: object
      required: [sections, overdue, earlier, completed]
      properties:
        sections:
          type: array
          description: Today and This Evening sections
          items:
            type: object
            required: [title, groups]
            properties:
              title:
                type: string
              groups:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectGroup'
        overdue:
          type: array
          description: Open tasks with deadline < today
          items:
            $ref: '#/components/schemas/TaskListItem'
        earlier:
          type: array
          description: Open tasks with when_date < today, not someday
          items:
            $ref: '#/components/schemas/TaskListItem'
        completed:
          type: array
          description: Tasks finished during the local calendar day
          items:
            $ref: '#/components/schemas/TaskListItem'

    UpcomingTask:
      allOf:
        - $ref: '#/components/schemas/TaskListItem'
        - type: object
          required: [schedule_date]
          properties:
            schedule_date:
              type: string
              description: The date this entry appears under

    ViewUpcoming:
      type: object
      required: [overdue, dates, earlier]
      properties:
        overdue:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'
        dates:
          type: array
          items:
            type: object
            required: [date, tasks]
            properties:
              date:
                type: string
                format: date
              tasks:
                type: array
                items:
                  $ref: '#/components/schemas/UpcomingTask'
        earlier:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'

    AreaGroup:
      type: object
      required: [area, projects, standalone_tasks]
      properties:
        area:
          $ref: '#/components/schemas/ProjectRef'
        projects:
          type: array
          items:
            type: object
            required: [project, tasks]
            properties:
              project:
                $ref: '#/components/schemas/ProjectRef'
              tasks:
                type: array
                items:
                  $ref: '#/components/schemas/TaskListItem'
        standalone_tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskListItem'

    ViewGrouped:
      type: object
      required: [areas, no_area]
      properties:
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaGroup'
        no_area:
          type: object
          required: [projects, standalone_tasks]
          properties:
            projects:
              type: array
              items:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/ProjectRef'
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskListItem'
            standalone_tasks:
              type: array
              description: Empty for anytime; someday loose tasks land here
              items:
                $ref: '#/components/schemas/TaskListItem'

    ViewPaged:
      type: object
      required: [groups, total]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [date, tasks]
            properties:
              date:
                type: string
              tasks:
                type: array
                items:
                  $ref: '#/components/schemas/TaskListItem'
        total:
          type: integer

    ViewCounts:
      type: object
      required: [inbox, today, overdue, review, anytime, someday, logbook, trash]
      properties:
        inbox:
          type: integer
        today:
          type: integer
        overdue:
          type: integer
        review:
          type: integer
        anytime:
          type: integer
        someday:
          type: integer
        logbook:
          type: integer
        trash:
          type: integer

    UserSettings:
      type: object
      required: [play_complete_sound, show_count_main, show_count_projects, show_count_tags, review_after_days, sort_areas, sort_tags, evening_starts_at, default_time_gap, show_time_badge, time_format, font_size, default_reminder_type, default_reminder_value, copy_reminders_to_recurring, notification_provider, ntfy_server_url, ntfy_topic, ntfy_access_token, base_url, privacy_mode, review_include_recurring]
      properties:
