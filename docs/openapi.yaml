    SearchResult:
      type: object
      required: [task, title_snippet, notes_snippet, rank]
      properties:
        task:
          $ref: '#/components/schemas/TaskListItem'
        title_snippet:
          type: string
          description: May contain <mark> highlights
        notes_snippet:
          type: string
        rank:
          type: number

    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
