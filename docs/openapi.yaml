      properties:
        id:
          type: string
        task_id:
          type: string
        type:
          type: string
          enum: [at_start, on_day, minutes_before, hours_before, days_before, exact]
        value:
          type: integer
          minimum: 0
          maximum: 99
        exact_at:
          type: [string, 'null']
          description: UTC RFC 3339 for exact reminders
        created_at:
          type: string

    RemindersList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'

    ReminderCreate:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [at_start, on_day, minutes_before, hours_before, days_before, exact]
        value:
          type: integer
          minimum: 0
          maximum: 99
        exact_at:
          type: string
          description: 'Required for exact; RFC 3339 with offset/Z, or naive YYYY-MM-DDTHH:MM[:SS] read in the server timezone'

    RecurrencePattern:
      type: object
      required: [type, every, mode]
      properties:
        type:
          type: string
          enum: [daily, daily_weekday, daily_weekend, weekly, monthly_dom, monthly_dow, monthly_workday, yearly_date, yearly_dow]
        every:
          type: integer
          minimum: 1
        mode:
          type: string
          enum: [fixed, after_completion]
        on:
          type: array
          description: weekly only; DayOfWeek values
          items:
            type: string
            enum: [mon, tue, wed, thu, fri, sat, sun]
        day:
          type: [integer, 'null']
          description: 'monthly_dom: 1-31, 0=last, negative=last-N, null=use when_date'
        ordinal:
          type: string
          description: monthly_dow and yearly_dow
          enum: [first, second, third, fourth, last]
        weekday:
          type: string
          description: monthly_dow and yearly_dow (full weekday names)
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        workday_position:
          type: string
          description: monthly_workday
          enum: [first, last]
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: yearly_date and yearly_dow

